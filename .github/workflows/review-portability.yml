name: Trusted x86 namespace validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  network:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare ephemeral runner tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y iproute2 ethtool libcap2-bin flex bison libmnl-dev libbpf-dev
          mkdir -p build
          uname -a > build/portability-environment.log
          systemd-detect-virt >> build/portability-environment.log || true
          tc -V >> build/portability-environment.log
          python3 -V >> build/portability-environment.log
      - name: Build without BPF
        id: build
        run: |
          cmake -S . -B build -G Ninja -DFLOWCORE_BPF=OFF -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Private helper security checks
        if: always() && steps.build.outcome == 'success'
        run: sudo --preserve-env=FLOWCORE_TC python3 -B tests/helper_integration.py > build/portability-helper.log 2>&1
      - name: Build pinned userspace tc with HTB JSON readback
        id: tc
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://www.kernel.org/pub/linux/utils/net/iproute2/iproute2-7.0.0.tar.xz \
            -o build/iproute2-7.0.0.tar.xz
          printf '%s  %s\n' e62890f7b5de63c05a3bf331dc8deb4c015c336013f341a4edf46969797f2f4e \
            build/iproute2-7.0.0.tar.xz | sha256sum -c -
          tar -xJf build/iproute2-7.0.0.tar.xz -C build
          make -C build/iproute2-7.0.0 -j2 SUBDIRS='lib tc' > build/portability-tc-build.log 2>&1
          tc="$GITHUB_WORKSPACE/build/iproute2-7.0.0/tc/tc"
          "$tc" -V >> build/portability-environment.log
          echo "FLOWCORE_TC=$tc" >> "$GITHUB_ENV"
      - name: Owned namespace service and recovery checks
        if: always() && steps.build.outcome == 'success' && steps.tc.outcome == 'success'
        run: |
          sudo --preserve-env=FLOWCORE_TC python3 -B tests/service_integration.py > build/portability-service.log 2>&1
          sudo --preserve-env=FLOWCORE_TC python3 -B tests/safety_integration.py > build/portability-safety.log 2>&1
      - name: Bounded TCP scale
        if: always() && steps.build.outcome == 'success'
        run: sudo --preserve-env=FLOWCORE_TC python3 -B tests/release_scale.py > build/portability-scale.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x86-namespace-validation
          path: |
            build/portability-*.log
            results/service-test-*/daemon.jsonl
