# Optional HTTPS reverse proxy. Replace the names and certificate paths.
# Set --public-host dashboard.example.invalid on dashboard.py.
server {
    listen 443 ssl;
    server_name dashboard.example.invalid;
    ssl_certificate /etc/ssl/dashboard/fullchain.pem;
    ssl_certificate_key /etc/ssl/dashboard/privkey.pem;
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8844;
        proxy_set_header Host dashboard.example.invalid;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection close;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_send_timeout 4s;
        client_max_body_size 1k;
    }
}
